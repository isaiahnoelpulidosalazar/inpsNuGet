name: Build inpsNuGet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: inpsNuGet.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version and release notes
        id: meta
        shell: bash
        run: |
          VERSION=$(dotnet msbuild "$PROJECT" -getProperty:Version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Notes = lines of the "## [VERSION]" section of CHANGELOG.md
          awk -v v="$VERSION" '
            /^## / { if (f) exit; if (index($0, "[" v "]")) { f = 1; next } }
            f { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > changes.txt
          [ -s changes.txt ] || echo "- No changes specified." > changes.txt

          {
            echo "Auto-generated release."; echo
            echo "Version: v$VERSION"; echo
            echo "Changes:"; cat changes.txt
          } > release-body.md

      - name: Restore, build, test, pack
        run: |
          dotnet restore "$PROJECT"
          dotnet build "$PROJECT" --configuration Release --no-restore
          dotnet test tests/inpsNuGet.Tests/inpsNuGet.Tests.csproj --configuration Release
          dotnet pack "$PROJECT" --configuration Release --no-build --output nuget/artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            nuget/artifacts/*
            release-body.md

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # lets GitHub issue the OIDC token that NuGet/login exchanges for an API key
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package

      # NuGet first (idempotent), release second, so a failed run can simply be re-run.
      # Trusted Publishing: exchange GitHub's OIDC token for a short-lived, single-use API key.
      # Keep this step directly before the push (the key expires in about an hour).
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "package/nuget/artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: inpsNuGet-v${{ needs.build.outputs.version }}
          name: inpsNuGet-v${{ needs.build.outputs.version }}
          body_path: package/release-body.md
          target_commitish: ${{ github.sha }}